name: CI

# Proves a release PR's source builds on its own before it can merge: the
# install uses public registries only, the build produces both channels (ADR
# 66) with every package check, the SDK's tests run, and the developer site
# builds with its check of the SDK's exports. Make the "build" check required
# for the default branch, so a release that does not build cannot publish.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build both channels with their checks
        run: npm run build

      - name: Test the SDK
        run: npm test

      - name: Build the developer site
        working-directory: apps/lace-sdk-site
        run: |
          npm ci
          npm run build
