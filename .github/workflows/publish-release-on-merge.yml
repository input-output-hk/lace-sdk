name: Publish release on merge

# Companion to the lace-platform publish workflow, for the Lace SDK's
# standalone repository (ADR 66).
#
# When a release/lace-sdk@<version> PR merges into the default branch, build
# the package from the merge commit, check it against the versioning rules,
# publish it to npmjs and GitHub Packages, then publish the corresponding draft
# GitHub release against the merge commit, and deploy the developer site. The
# release goes public before the site, so a release that fails a check or a
# publish stays a draft and a re-run resumes it. When a release PR closes
# without merging, delete the orphan draft.

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: read

jobs:
  # build-sdk and cleanup-orphan-draft guard on:
  #   - base.ref == default branch — release/<tag> PRs always target it,
  #     so a non-default-branch PR with a release/* head is unrelated.
  #   - head.repo.fork == false — a fork PR named release/<existing-tag>
  #     could otherwise publish or delete the corresponding draft release.
  #     The publish workflow only ever pushes release/* to the public repo
  #     itself (never from a fork), so this is safe to require.
  #
  # The package is built from the merged public source, which installs from
  # public registries only. The build runs dependency code, so it holds no
  # credentials: it hands the two tarballs to publish-sdk, which runs no
  # installed code. These jobs live in this workflow because a release
  # published with GITHUB_TOKEN never triggers a separate on-release workflow.

  build-sdk:
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      startsWith(github.event.pull_request.head.ref, 'release/lace-sdk@')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      NPM_PACKAGE: '@laceio/sdk'
      GITHUB_PACKAGE: '@input-output-hk/lace-sdk'
    outputs:
      npm_tarball: ${{ steps.pack.outputs.npm_tarball }}
      github_tarball: ${{ steps.pack.outputs.github_tarball }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      # Two channels (ADR 66): lace-sdk@X.Y.Z is the stable build on `latest`;
      # lace-sdk@X.Y.Z-canary.N is the canary build on `canary`, where X.Y.Z is
      # the stable version package.json names next.
      - name: Resolve the channel from the tag
        id: version
        run: |
          set -euo pipefail
          tag=${HEAD_REF#release/}
          base=$(node -p "require('./apps/lace-sdk/package.json').version")
          version=${tag#lace-sdk@}
          if [[ "$version" == "$base" ]]; then
            channel=stable
            dist_tag=latest
          elif [[ "$version" =~ ^${base//./\\.}-canary\.[0-9]+$ ]]; then
            channel=canary
            dist_tag=canary
          else
            echo "::error::release $tag is neither lace-sdk@$base nor lace-sdk@$base-canary.N (apps/lace-sdk/package.json is $base)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Set the canary version
        if: steps.version.outputs.channel == 'canary'
        working-directory: apps/lace-sdk
        run: npm version "${{ steps.version.outputs.value }}" --no-git-tag-version

      - run: npm run build
        env:
          SDK_CHANNEL: ${{ steps.version.outputs.channel }}

      # ADR 66's versioning rules, against the latest stable on npm. The
      # private repo runs the same check before it mirrors; this is the last
      # one before anything publishes.
      - name: Check the versioning rules
        run: node apps/lace-sdk/scripts/check-release.ts
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}

      # The same build is packed twice, once per name: npmjs carries the SDK as
      # @laceio/sdk, and GitHub Packages accepts only this repository owner's
      # scope, so it carries the identical contents as @input-output-hk/lace-sdk.
      - name: Pack for each registry
        id: pack
        working-directory: apps/lace-sdk
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tarballs"
          pack() {
            npm pack --json --pack-destination "$RUNNER_TEMP/tarballs" | node -pe 'JSON.parse(require("fs").readFileSync(0))[0].filename'
          }
          echo "npm_tarball=$(pack)" >> "$GITHUB_OUTPUT"
          npm pkg set name="$GITHUB_PACKAGE"
          echo "github_tarball=$(pack)" >> "$GITHUB_OUTPUT"
          git checkout -- package.json

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-tarballs
          path: ${{ runner.temp }}/tarballs/
          if-no-files-found: error
          retention-days: 7

  # Setup on this repo: environment npm-publish; for the first npmjs publish
  # only, its secret NPM_PUBLISH_TOKEN (publish rights in the @laceio npm org);
  # afterwards npmjs trusted publishing (OIDC) for this workflow and
  # environment replaces it. The GitHub
  # Packages package @input-output-hk/lace-sdk must grant this repository
  # write access; Pages → Source must be GitHub Actions.
  publish-sdk:
    needs: build-sdk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # npm's trusted publisher is bound to this environment, so only this job
    # can mint a token npm accepts; it also holds NPM_PUBLISH_TOKEN.
    environment: npm-publish
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      NPM_PACKAGE: '@laceio/sdk'
      GITHUB_PACKAGE: '@input-output-hk/lace-sdk'
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*

      # From the event, not from build-sdk's outputs: the build runs dependency
      # code, so nothing it hands over decides what publishes.
      - name: Resolve the release from the branch
        id: release
        run: |
          set -euo pipefail
          tag=${HEAD_REF#release/}
          version=${tag#lace-sdk@}
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-canary\.[0-9]+)?$ ]]; then
            echo "::error::$HEAD_REF does not name lace-sdk@X.Y.Z[-canary.N]"
            exit 1
          fi
          dist_tag=latest
          [[ "$version" == *-canary.* ]] && dist_tag=canary
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "DIST_TAG=$dist_tag" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: sdk-tarballs
          path: ${{ runner.temp }}/tarballs

      # The build job runs dependency code, so each tarball is held to the name
      # and version this release publishes before anything signs or publishes it.
      # npm reads the manifest of whichever top-level directory unpacks last, so
      # a tarball holding anything outside package/ is refused.
      - name: Check each tarball's name and version
        env:
          NPM_TARBALL: ${{ runner.temp }}/tarballs/${{ needs.build-sdk.outputs.npm_tarball }}
          GITHUB_TARBALL: ${{ runner.temp }}/tarballs/${{ needs.build-sdk.outputs.github_tarball }}
        run: |
          set -euo pipefail
          check() {
            local entries
            entries=$(tar -tzf "$1")
            if grep -v '^package/' <<<"$entries" >/dev/null; then
              echo "::error::$(basename "$1") holds entries outside package/"
              exit 1
            fi
            local manifest
            manifest=$(tar -xzOf "$1" package/package.json)
            local actual
            actual=$(node -e 'const m = JSON.parse(process.argv[1]); console.log(`${m.name}@${m.version}`)' "$manifest")
            if [[ "$actual" != "$2@$VERSION" ]]; then
              echo "::error::$(basename "$1") holds $actual, not $2@$VERSION"
              exit 1
            fi
            echo "✓ $(basename "$1") is $actual"
          }
          check "$NPM_TARBALL" "$NPM_PACKAGE"
          check "$GITHUB_TARBALL" "$GITHUB_PACKAGE"

      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            ${{ runner.temp }}/tarballs/${{ needs.build-sdk.outputs.npm_tarball }}
            ${{ runner.temp }}/tarballs/${{ needs.build-sdk.outputs.github_tarball }}

      # Each publish names its scope's registry explicitly, so no .npmrc scope
      # mapping can redirect it. Each skips a version already present, so a
      # re-run after a partial failure completes the other registry.
      - name: Publish to npmjs
        env:
          NPM_PUBLISH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
          NPM_TARBALL: ${{ runner.temp }}/tarballs/${{ needs.build-sdk.outputs.npm_tarball }}
        run: |
          set -euo pipefail
          registry=https://registry.npmjs.org
          if [[ -n "$NPM_PUBLISH_TOKEN" ]]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_PUBLISH_TOKEN}" > "$RUNNER_TEMP/.npmrc-npmjs"
          else
            : > "$RUNNER_TEMP/.npmrc-npmjs"
          fi
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/.npmrc-npmjs"
          if npm view "$NPM_PACKAGE@$VERSION" version --@laceio:registry=$registry >/dev/null 2>&1; then
            echo "::notice::$NPM_PACKAGE@$VERSION is already on npmjs; skipping"
            exit 0
          fi
          npm publish "$NPM_TARBALL" --provenance --access public --tag "$DIST_TAG" \
            --@laceio:registry=$registry

      - name: Publish to GitHub Packages
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TARBALL: ${{ runner.temp }}/tarballs/${{ needs.build-sdk.outputs.github_tarball }}
        run: |
          set -euo pipefail
          registry=https://npm.pkg.github.com
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_PACKAGES_TOKEN}" > "$RUNNER_TEMP/.npmrc-gpr"
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/.npmrc-gpr"
          if npm view "$GITHUB_PACKAGE@$VERSION" version --@input-output-hk:registry=$registry >/dev/null 2>&1; then
            echo "::notice::$GITHUB_PACKAGE@$VERSION is already on GitHub Packages; skipping"
            exit 0
          fi
          npm publish "$GITHUB_TARBALL" --access public --tag "$DIST_TAG" \
            --@input-output-hk:registry=$registry

  flip:
    needs: [build-sdk, publish-sdk]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.publish-sdk.outputs.tag }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # Look up the draft via the LIST endpoint (which returns
          # drafts) rather than `gh release view <tag>` (which goes
          # through /releases/tags/<tag> — that endpoint only returns
          # published releases since drafts don't have a real git tag).
          release_id=$(gh api --paginate "/repos/$GITHUB_REPOSITORY/releases" \
            --jq "[.[] | select(.tag_name == \"$TAG\" and .draft == true)][0].id")

          if [[ -z "$release_id" || "$release_id" == "null" ]]; then
            echo "::error::no draft release found for tag '$TAG' — merged PR #$PR_NUMBER. Existing releases:"
            gh api "/repos/$GITHUB_REPOSITORY/releases" \
              --jq '.[] | "  tag=\(.tag_name) draft=\(.draft) published_at=\(.published_at // "(draft)")"'
            exit 1
          fi

          # Retarget the draft at the merge commit and publish. The tag
          # is created against MERGE_SHA at publish time, so squash /
          # rebase / merge-commit strategies all behave correctly.
          gh api -X PATCH "/repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false -f target_commitish="$MERGE_SHA" > /dev/null
          echo "Published $TAG (release id $release_id) targeting merge commit $MERGE_SHA"

  # The github-pages environment deploys from main only, and this workflow runs
  # on the pull request's merge ref, so the site deploys in its own workflow.
  # A workflow_dispatch is the one event GITHUB_TOKEN may start.
  deploy-sdk-site:
    needs: [publish-sdk, flip]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start the site deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.publish-sdk.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh workflow run deploy-site.yml --repo "$GITHUB_REPOSITORY" \
            --ref "$DEFAULT_BRANCH" -f release_tag="$TAG"

  cleanup-orphan-draft:
    if: >
      github.event.pull_request.merged == false &&
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - name: Delete orphan draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          tag="${HEAD_REF#release/}"

          # Same lookup mode as the flip job — list endpoint, not
          # /releases/tags/ (which doesn't return drafts).
          release_id=$(gh api --paginate "/repos/$GITHUB_REPOSITORY/releases" \
            --jq "[.[] | select(.tag_name == \"$tag\" and .draft == true)][0].id")

          if [[ -n "$release_id" && "$release_id" != "null" ]]; then
            gh api -X DELETE "/repos/$GITHUB_REPOSITORY/releases/$release_id"
            echo "Deleted orphan draft $tag (release id $release_id)"
          else
            echo "No orphan draft for $tag; nothing to clean up."
          fi
