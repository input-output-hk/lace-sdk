name: 🐛 Bug report
description: Report a defect in the Lace SDK, its developer site, or the published source.
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the
        fields below so we can reproduce and triage it efficiently.

        **For security vulnerabilities, please use the private reporting
        channel instead** — see [SECURITY.md](https://github.com/input-output-hk/lace-sdk/blob/main/SECURITY.md).

  - type: dropdown
    id: surface
    attributes:
      label: Which part?
      options:
        - SDK (@laceio/sdk)
        - Developer site
        - Source / build reproducibility
        - Other / not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The installed version (`npm ls @laceio/sdk`), e.g. `0.1.0`.
      placeholder: 0.1.0
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the unexpected behavior.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser/OS version, device model, network (mainnet/preprod/preview/testnet), etc.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots, or additional context
      description: Attach anything that helps us understand the issue. Please redact any sensitive data.
    validations:
      required: false
